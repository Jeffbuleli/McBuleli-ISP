# McBuleli ISP - stack VPS (API + Postgres dedie)
# Usage (depuis ops/vps):
#   cp .env.example .env   # remplir secrets
#   docker compose up -d --build
#   bash restore-db.sh ../../backups/isp_billing_XXXX.dump   # optionnel

name: mcbuleli-isp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-isp_billing}
    volumes:
      - isp_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp_app} -d ${POSTGRES_DB:-isp_billing}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: ops/vps/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-isp_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-isp_billing}
      PORT: "4000"
      NODE_ENV: production
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - isp_uploads:/app/backend/uploads

volumes:
  isp_pgdata:
  isp_uploads:
