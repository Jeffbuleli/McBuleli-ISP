# Nginx - McBuleli ISP (app.mcbuleli.live)
# Install:
#   cp ops/vps/nginx-mcbuleli-isp.conf /etc/nginx/sites-available/mcbuleli-isp
#   ln -sf /etc/nginx/sites-available/mcbuleli-isp /etc/nginx/sites-enabled/
#   certbot --nginx -d app.mcbuleli.live
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.mcbuleli.live;

    # After certbot, this block is upgraded to 443 + redirect.

    client_max_body_size 20m;

    root /opt/mcbuleli-isp/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
