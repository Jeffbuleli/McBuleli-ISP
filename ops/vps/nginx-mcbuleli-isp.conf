# Nginx - McBuleli ISP
# - App: isp.mcbuleli.org + *.isp.mcbuleli.org (includes docs.isp.mcbuleli.org)
# - Legacy: mcbuleli.live / www → 301 https://isp.mcbuleli.org$request_uri
#
# DNS:
#   isp.mcbuleli.org (proxy OK)
#   *.isp.mcbuleli.org → 162.35.181.98 DNS-only (grey) for origin TLS
#   mcbuleli.live → this VPS (redirect only)

# ---- Platform + tenant subdomains ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isp.mcbuleli.org *.isp.mcbuleli.org;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/isp.mcbuleli.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isp.mcbuleli.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/mcbuleli-isp/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Host $host;
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name isp.mcbuleli.org *.isp.mcbuleli.org;
    return 301 https://$host$request_uri;
}

# ---- Legacy mcbuleli.live → isp.mcbuleli.org ----
server {
    listen 80;
    listen [::]:80;
    server_name mcbuleli.live www.mcbuleli.live;
    return 301 https://isp.mcbuleli.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcbuleli.live www.mcbuleli.live;

    ssl_certificate /etc/letsencrypt/live/mcbuleli.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcbuleli.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://isp.mcbuleli.org$request_uri;
}
