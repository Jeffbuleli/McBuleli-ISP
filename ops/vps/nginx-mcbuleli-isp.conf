# Nginx - McBuleli ISP (mcbuleli.live)
# Install:
#   cp ops/vps/nginx-mcbuleli-isp.conf /etc/nginx/sites-available/mcbuleli-isp
#   ln -sf /etc/nginx/sites-available/mcbuleli-isp /etc/nginx/sites-enabled/
#   certbot --nginx -d mcbuleli.live
#   nginx -t && systemctl reload nginx
#
# Note: after certbot, SSL listen blocks are injected; keep PWA locations in the HTTPS server.

server {
    listen 80;
    listen [::]:80;
    server_name mcbuleli.live;

    client_max_body_size 20m;

    root /opt/mcbuleli-isp/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Host $host;
        # Allow browser to consume API-served manifests from same origin
        proxy_hide_header Cross-Origin-Resource-Policy;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
